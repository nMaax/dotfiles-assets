name: Gallery

on:
  push:
    branches: [main]
    paths: ["wallpapers/**", ".github/workflows/gallery.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick ffmpeg

      # Rebuilt from scratch each run: removed wallpapers drop out, replaced ones refresh
      - name: Thumbnails
        run: |
          rm -rf thumbnails && mkdir thumbnails
          for f in wallpapers/*; do
            t="thumbnails/$(basename "$f").jpg"
            case "$f" in
              *.mp4|*.webm|*.mkv) ffmpeg -loglevel error -ss 1 -i "$f" -frames:v 1 -vf scale=480:-2 "$t" ;;
              *) convert "$f[0]" -strip -thumbnail 480x -quality 82 "$t" ;;
            esac
          done

      - name: README
        run: |
          {
            echo "# Wallpapers"
            echo
            echo "$(ls wallpapers | wc -l) wallpapers. Click a thumbnail for the full file; ▶ marks a video."
            echo
            for f in wallpapers/*; do
              n=$(basename "$f")
              case "$n" in *.mp4|*.webm|*.mkv) alt="▶ $n" ;; *) alt="$n" ;; esac
              echo "<a href=\"$f\"><img src=\"thumbnails/$n.jpg\" alt=\"$alt\" title=\"$alt\" width=\"32%\"></a>"
            done
          } > README.md

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A thumbnails README.md
          git diff --cached --quiet || { git commit -m "Regenerate wallpaper gallery"; git push; }
