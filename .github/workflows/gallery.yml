name: Gallery

on:
  push:
    branches: [main]
    paths: ["wallpapers/**", ".github/workflows/gallery.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick ffmpeg

      # Rebuilt from scratch each run: removed wallpapers drop out, replaced ones refresh
      - name: Thumbnails
        run: |
          rm -rf thumbnails && mkdir thumbnails
          for f in wallpapers/*; do
            t="thumbnails/$(basename "$f").jpg"
            case "$f" in
              *.mp4|*.webm|*.mkv)
                ffmpeg -loglevel error -ss 1 -i "$f" -frames:v 1 -vf "scale=480:270:force_original_aspect_ratio=increase,crop=480:270" "$t"
                convert "$t" -fill "rgba(0,0,0,0.55)" -draw "circle 240,135 240,172" -fill white -draw "polygon 229,117 229,153 260,135" -quality 82 "$t" ;;
              *) convert "$f[0]" -strip -thumbnail "480x270^" -gravity center -extent 480x270 -quality 82 "$t" ;;
            esac
          done

      # Unmatched names land in Others, so a new wallpaper never goes missing
      - name: README
        run: |
          section() {
            case "$1" in
              wallhack-*) echo "WALLHACK" ;;
              lucy*|rei*|evelyn*|pink-lady*|cowboybeboop*|cyberpunk*|sao*|cubone*|red*|wanna-stay*) echo "Anime" ;;
              hokusai*|gyarados*|eclipse*) echo "Art" ;;
              abstract*|cachy-*|neaben*) echo "Abstract" ;;
              *) echo "Others" ;;
            esac
          }
          {
            echo "# Wallpapers"
            echo
            echo "$(ls wallpapers | wc -l) wallpapers. Click a thumbnail for the full file; ▶ marks a video."
            for s in "Anime" "WALLHACK" "Art" "Abstract" "Others"; do
              files=$(for f in wallpapers/*; do if [ "$(section "$(basename "$f")")" = "$s" ]; then echo "$f"; fi; done)
              [ -z "$files" ] && continue
              printf '\n## %s\n\n' "$s"
              for f in $files; do
                n=$(basename "$f")
                echo "<a href=\"$f\"><img src=\"thumbnails/$n.jpg\" alt=\"$n\" title=\"$n\" width=\"32%\"></a>"
              done
            done
          } > README.md

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A thumbnails README.md
          git diff --cached --quiet || { git commit -m "Regenerate wallpaper gallery"; git push; }
